# .github/workflows/web-tests.yml
name: Web Tests - Chrome

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '0 8 * * *'  # Ejecutar diariamente a las 8 AM
  workflow_dispatch:      # Permitir ejecución manual

env:
  CI: true  # 👈 Activa headless automáticamente

jobs:
  web-tests:
    name: 🌐 Pruebas Web - Chrome
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del código
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Instalar Playwright (solo Chrome)
      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 5. Ejecutar pruebas web
      - name: 🧪 Run Web Tests
        run: npm run test:web

      # 6. Subir reporte HTML
      - name: 📊 Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-report
          path: reports/playwright-report/

      # 7. Subir screenshots
      - name: 📸 Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: reports/screenshots/

      # 8. Subir videos
      - name: 🎥 Upload Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-videos
          path: reports/videos/

      # 9. Subir resultados JSON
      - name: 📄 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-results
          path: |
            reports/test-results.json
            reports/junit.xml